name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - run: vp install

      - run: vp pack
      - run: vp run -r prepack

      - run: vp check

      - run: vp run test:types

      - run: vp test
