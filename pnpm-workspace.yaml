packages:
  - docs
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true

autoInstallPeers: true
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
  - undici-types
